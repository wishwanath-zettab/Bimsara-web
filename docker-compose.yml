# Compose project name. Without it the project is named after the directory the
# checkout happens to sit in — on the VM that is /opt/bimsara-web/repo, which
# produced containers, images and volumes called "repo-*".
name: bimsara-web

services:
  app:
    build: .
    # Pinned so the built image is bimsara-web:latest rather than <project>-app.
    image: bimsara-web:latest
    # Single instance, so a fixed name is safe and makes docker ps / logs /
    # exec read as "bimsara-web" instead of bimsara-web-app-1.
    container_name: bimsara-web
    # One plain-HTTP port, host == container, matching how the propertyweb
    # frontend/backend containers are published on this host. TLS terminates at
    # nginx, which proxies to http://127.0.0.1:8100 — see nginx/bimsaraweb.conf
    # in the propertyweb-infra repo.
    #
    # 8100 rather than 80: nginx owns 80/443 on the VM's only public address.
    # It also sits outside the 8081-8096 block that propertyweb qa/prod reserve
    # in infra/env/*/{frontend,backend}.env, so adding another propertyweb
    # environment later cannot collide with this one.
    #
    # Published on all interfaces (0.0.0.0 + ::), like the propertyweb
    # containers, so the app also answers directly on :8100 over plain HTTP for
    # anyone who can reach the VM there. Keep it closed at the firewall if it
    # should only be served through nginx.
    ports:
      - "${HTTP_HOST_PORT:-8100}:8100"
    volumes:
      - app-data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-bimsara-local-secret-change-me}
      - DB_PATH=/app/data/bimsara_admin.db
      - UPLOADS_PATH=/app/data/uploads
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - PORT=8100
      # SSL_CERT_PATH / SSL_KEY_PATH are deliberately unset, and no certificate
      # is mounted. With them, server.js starts its own HTTPS listener and turns
      # PORT into a bare 301-to-https redirector — behind a TLS-terminating
      # proxy that bounces every proxied request straight back out. Unset,
      # server.js serves the app itself over plain HTTP on PORT, and the private
      # key never enters the container.
      #
      # Set them (and re-add a cert mount) only when running this container
      # WITHOUT a proxy in front.
    restart: unless-stopped

volumes:
  # Named explicitly rather than taking the <project>_app-data prefix: this
  # volume holds the SQLite DB and uploads, so it must survive the project ever
  # being renamed again. Migrated from the old repo_app-data by hand.
  app-data:
    name: bimsara-web-data
