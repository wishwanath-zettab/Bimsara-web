# Compose project name. Without it the project is named after the directory the
# checkout happens to sit in — on the VM that is /opt/bimsara-web/repo, which
# produced containers, images and volumes called "repo-*".
name: bimsara-web

services:
  app:
    build: .
    # Pinned so the built image is bimsara-web:latest rather than <project>-app.
    image: bimsara-web:latest
    # Single instance, so a fixed name is safe and makes docker ps / logs /
    # exec read as "bimsara-web" instead of bimsara-web-app-1.
    container_name: bimsara-web
    # TLS terminates at the host nginx, not here — see nginx/bimsaraweb.conf in
    # the propertyweb-infra repo. nginx owns 80/443 on this VM, so the app is
    # published on HTTP_HOST_PORT and proxied to from there.
    #
    # Published on all interfaces (0.0.0.0 + [::]), matching the propertyweb
    # containers on this host. That means the app also answers directly on
    # :8080 over plain HTTP for anyone who can reach the VM on that port, so
    # keep 8080 closed at the firewall / security group if it should only be
    # served through nginx.
    #
    # The container port stays 80 so one image works everywhere; HTTP_HOST_PORT
    # is the only thing that moves per host.
    ports:
      - "${HTTP_HOST_PORT:-8080}:80"
    volumes:
      - app-data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-bimsara-local-secret-change-me}
      - DB_PATH=/app/data/bimsara_admin.db
      - UPLOADS_PATH=/app/data/uploads
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # SSL_CERT_PATH / SSL_KEY_PATH are deliberately unset: with them the app
      # starts its own HTTPS listener on 443 and turns port 80 into a bare
      # 301-to-https redirector, which behind a TLS-terminating proxy would
      # bounce every proxied request straight back out. Leaving them unset makes
      # server.js serve the app itself over plain HTTP. Set them (and re-add the
      # cert mount) only when running this container WITHOUT a proxy in front.
    restart: unless-stopped

volumes:
  # Named explicitly rather than taking the <project>_app-data prefix: this
  # volume holds the SQLite DB and uploads, so it must survive the project ever
  # being renamed again. Migrated from the old repo_app-data by hand.
  app-data:
    name: bimsara-web-data
