services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - app-data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-bimsara-local-secret-change-me}
      - DB_PATH=/app/data/bimsara_admin.db
      - UPLOADS_PATH=/app/data/uploads
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    restart: unless-stopped

volumes:
  app-data:
