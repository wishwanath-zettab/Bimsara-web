# Compose project name. Without it the project is named after the directory the
# checkout happens to sit in — on the VM that is /opt/bimsara-web/repo, which
# produced containers, images and volumes called "repo-*".
name: bimsara-web

services:
  app:
    build: .
    # Pinned so the built image is bimsara-web:latest rather than <project>-app.
    image: bimsara-web:latest
    # Single instance, so a fixed name is safe and makes docker ps / logs /
    # exec read as "bimsara-web" instead of bimsara-web-app-1.
    container_name: bimsara-web
    # Host port == container port on both stacks (0.0.0.0 and ::), matching the
    # propertyweb containers on this host. 8080/8443 rather than 80/443 because
    # nginx holds 80/443 on the VM's only public address — publishing 80 here is
    # what produced "failed to bind host port 0.0.0.0:80: address already in
    # use". PORT/HTTPS_PORT below move the app's listeners to match.
    ports:
      - "${HTTP_HOST_PORT:-8080}:8080"
      - "${HTTPS_HOST_PORT:-8443}:8443"
    volumes:
      - app-data:/app/data
      # The wildcard cert nginx also serves, read-only. NOT /opt/devops/certs/
      # new_cert — that directory is empty on the VM, so the app silently fell
      # back to plain HTTP when it was mounted there.
      - /etc/ssl/propweb:/app/certs:ro
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-bimsara-local-secret-change-me}
      - DB_PATH=/app/data/bimsara_admin.db
      - UPLOADS_PATH=/app/data/uploads
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - PORT=8080
      - HTTPS_PORT=8443
      # With these set, server.js serves the app over HTTPS on HTTPS_PORT and
      # turns PORT into a 301-to-https redirector. nginx must therefore proxy to
      # https://127.0.0.1:8443 — pointed at 8080 it would receive a redirect to
      # the same URL it just requested and loop.
      - SSL_CERT_PATH=/app/certs/STAR.bimsara.com.crt
      - SSL_KEY_PATH=/app/certs/STAR.bimsara.com.key
    restart: unless-stopped

volumes:
  # Named explicitly rather than taking the <project>_app-data prefix: this
  # volume holds the SQLite DB and uploads, so it must survive the project ever
  # being renamed again. Migrated from the old repo_app-data by hand.
  app-data:
    name: bimsara-web-data
